schema_version: 1

context:
  version: "0.7.9"
  build_number: "0"

package:
  name: aioresponses
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/a/aioresponses/aioresponses-${{ version }}.tar.gz
  sha256: 1dcfa28938fc006f046a98383a7c07ac180be7a492c1ed557f5cd7b0805357d3

build:
  number: 1
  noarch: python
  script:
      env:
        PBR_VERSION: ${{ version }}
      content:
        - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
    - pbr
  run:
    - python >=${{ python_min }}
    - aiohttp >=3.8.0,<4
    - packaging >=22.0

tests:
  - python:
      imports:
        - aioresponses
      pip_check: true
      python_version:
        - '*'
        - ${{ python_min }}.*
  - script:
      - python -c "import importlib.metadata as m; assert m.version('aioresponses') == '${{ version }}', m.version('aioresponses')"

about:
  summary: Mock out requests made by ClientSession from aiohttp package
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/pnuckowski/aioresponses

extra:
  recipe-maintainers:
    - jonashaag
