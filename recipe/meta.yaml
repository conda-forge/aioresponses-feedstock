{% set name = "aioresponses" %}
{% set version = "0.7.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/aioresponses-{{ version }}.tar.gz
  sha256: 1dcfa28938fc006f046a98383a7c07ac180be7a492c1ed557f5cd7b0805357d3 

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - aiohttp >=3.8.0,<4
    - packaging >=22.0

test:
  imports:
    - aioresponses
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pnuckowski/aioresponses
  summary: Mock out requests made by ClientSession from aiohttp package
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jonashaag
